<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Pathways: Barrier Quest (Slideshow)</title>
<style>
:root{--bg:#f6f3ee;--surface:#fff;--ink:#1f2937;--muted:#6b7280;--accent:#2f5d8a;--accent2:#e8913a;--line:#e3ddd2;--accent-ink:#fff;--sel:#e7f0f8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191f;--surface:#1f252d;--ink:#eef1f5;--muted:#9aa4b2;--accent:#7fb2e5;--accent2:#f0a85a;--line:#323a45;--accent-ink:#10161d;--sel:#26394d}}
:root[data-theme="dark"]{--bg:#15191f;--surface:#1f252d;--ink:#eef1f5;--muted:#9aa4b2;--accent:#7fb2e5;--accent2:#f0a85a;--line:#323a45;--accent-ink:#10161d;--sel:#26394d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;line-height:1.5}
.app{height:100%;display:flex;flex-direction:column;max-width:1040px;margin:0 auto}
header{padding:14px 20px 6px;display:flex;align-items:center;gap:12px}
.brand{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.bar{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent2);transition:width .35s}
main{flex:1;overflow:auto;padding:10px 20px 20px;display:flex}
.slide{margin:auto;width:100%;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.eyebrow{color:var(--accent);font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.1;margin:.3em 0}
h2{font-size:clamp(1.5rem,4.5vw,2.3rem);line-height:1.15;margin:.25em 0 .3em}
p.lead{font-size:1.05rem;color:var(--muted);max-width:68ch;margin:.3em 0}
.sub{font-size:1.25rem;font-weight:600;margin:.2em 0}
.hero{text-align:center}.hero .emoji{font-size:3.5rem}.hero p.lead{margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.chip b{display:block;margin:2px 0 4px}.chip span.i{font-size:1.5rem}.chip span.d{font-size:.9rem;color:var(--muted);display:block}
.count{margin-top:12px;color:var(--muted);font-size:.95rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:16px}
.flipwrap{display:flex;flex-direction:column;gap:8px}
.flip{perspective:1000px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left}
.in{display:grid}
.face{grid-area:1/1;border-radius:16px;padding:16px 18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .5s;border:2px solid var(--line);background:var(--surface);min-height:230px;display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg);background:var(--sel);border-color:var(--accent);font-size:.95rem}
.flip.on .front{transform:rotateY(-180deg)}.flip.on .back{transform:rotateY(0)}
.lab{font-size:.7rem;font-weight:800;letter-spacing:.1em;color:var(--accent);margin-bottom:8px}
.face .hint{font-size:.75rem;color:var(--muted);margin-top:auto;padding-top:10px}
.face.front p{margin:6px 0 0;font-size:.95rem}
.save{border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.save[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px 14px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent2)}
.sum{margin-top:12px;display:grid;gap:10px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum small{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.empty{color:var(--muted);font-style:italic}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
@media (max-width:520px){.dots{display:none}}
</style>
</head>
<body>
<div class="app">
  <header><div class="brand">Module 7 · Overcoming Barriers</div><div class="bar"><i id="prog"></i></div></header>
  <main><div id="slide" class="slide"></div></main>
  <footer>
    <button class="btn ghost" id="prev">← Back</button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="next">Next →</button>
  </footer>
</div>
<script>
var DATA=[
{id:"cost",i:"💰",n:"Paying for College",b:"Tuition, books, housing, and everyday costs feel overwhelming.",s:[
["Explore scholarships.","Start looking for scholarships available, including local, state, and national opportunities.","Scholarships can help pay for tuition, books, housing, and other college expenses. Some scholarships are available before senior year, so starting early gives you more time to find opportunities or time to prepare yourself to apply next year."],
["Learn about FAFSA and financial aid.","Ask a school counselor or trusted adult to explain grants, work-study, loans, and the FAFSA (Free Application for Federal Student Aid).","Financial aid can make college more affordable. Understanding the different types of aid can help you identify money you may qualify for that doesn’t have to be repaid."],
["Compare college costs.","Research tuition, fees, housing, and other expenses at different colleges. Look at community colleges and public universities too.","The cost of college varies widely. Comparing options can help you find a school that fits your academic goals and financial situation."],
["Consider different pathways to a degree.","Explore starting at a community college, participating in dual enrollment, or transferring to a four-year university later.","You may be able to earn college credits or complete part of your degree at a lower cost without giving up your goal of earning a bachelor’s degree."],
["Talk with a financial aid advisor.","Contact a college financial aid office or ask your school counselor to help you understand your options.","Financial aid can be confusing. An advisor can explain available resources and help you understand what college might actually cost after financial assistance."]]},
{id:"ready",i:"📚",n:"Feeling Ready Academically",b:"You’re unsure if your grades, skills, or study habits are enough.",s:[
["Meet with your school counselor.","Review your transcript and graduation requirements together. Ask whether you’re on track for the colleges or programs you’re interested in.","You’ll have a better understanding of where you stand academically and what classes or credits you may still need."],
["Take advantage of tutoring.","Ask teachers about tutoring, study groups, after-school help, or online academic resources.","Getting help now can strengthen your understanding of the challenging subjects before you begin college-level coursework."],
["Utilize college readiness programs.","Lean into resources and services available to you through GEAR UP or other college preparation opportunities.","These programs provide academic support, mentoring, college preparation activities, and opportunities to experience college."],
["Build stronger study habits.","Practice creating a study schedule, breaking assignments into smaller tasks, and preparing for tests ahead of time.","College often requires more independent learning. Developing these habits now can make the transition from high school to college easier."],
["Explore dual enrollment or college-level courses.","Ask your counselor whether you can take a college course while still in high school.","Taking a college-level course can help you experience the expectations of college academics while having access to support from your high school."]]},
{id:"time",i:"⏱️",n:"Balancing Time & Responsibilities",b:"Work, family, caregiving, or other commitments compete with school.",s:[
["Create a weekly schedule.","Map out your schoolwork, job, extracurricular activities, family responsibilities, and personal time.","Seeing how you spend your time can help you identify opportunities to make college preparation more manageable and recognize where you may need support."],
["Explore flexible college options.","Research online classes, part-time enrollment, evening courses, or colleges with flexible schedules.","College doesn’t have to be the same for everyone. Flexible options may allow you to continue working or managing other responsibilities while earning a degree."],
["Learn about campus support services.","Research academic advising, tutoring, and other student support services at colleges you’re considering.","Colleges may offer resources that help students balance academics with responsibilities outside the classroom."],
["Start preparing now in small steps.","Set aside 15-30 minutes each week to research colleges, explore scholarships, or work on college preparation tasks.","Breaking big tasks into smaller steps can make the college planning process feel less overwhelming, especially when you have a busy schedule."],
["Talk with someone you trust.","Discuss your responsibilities and college goals with a counselor, teacher, family member, or mentor.","Someone who understands your situation may help you identify resources, find solutions, or adjust your plans so college feels more manageable."]]},
{id:"fit",i:"🧭",n:"Knowing Where I Fit",b:"College feels unfamiliar, intimidating, or like it may not be for people like me.",s:[
["Explore different college environments.","Research community colleges, technical schools, public universities, private colleges, and historically Black colleges and universities (HBCUs).","Different schools offer different experiences, programs, sizes, and campus environments. Exploring options can help you discover what feels right for you."],
["Take a career interest assessment.","Ask your counselor about career inventories or online assessments that connect your interests and strengths to possible careers.","Learning more about your interests can help you identify potential career paths and college programs worth exploring."],
["Visit a college campus.","Attend a campus tour, college fair, open house, or virtual tour.","Seeing a campus and learning about student life can help you picture yourself in college and determine what kind of environment you prefer."],
["Talk to current college students.","Ask recent graduates, college ambassadors, or mentors about their experiences.","Hearing from students can give you a realistic picture of college life, including what they enjoy, what surprised them, and what they wish they had known."],
["Explore student organizations and support communities.","Research clubs, cultural organizations, first-generation student programs, and other campus communities.","Finding people with shared interests or experiences can help you feel connected and supported on campus."]]},
{id:"app",i:"📝",n:"The Application Process",b:"Deadlines, forms, choosing a school, or asking for help feels confusing.",s:[
["Make a college application checklist.","Write down important application deadlines, required documents, test dates, and other tasks.","A checklist helps you stay organized and prevents important steps from being overlooked when application season arrives."],
["Meet with your school counselor.","Ask about application requirements, college admissions, transcripts, recommendation letters, and deadlines.","Your counselor can help explain the process and connect you with resources to complete each step."],
["Research college admission requirements.","Visit college websites to learn about GPA expectations, entrance exams, essays, and application fees.","Knowing what colleges expect gives you time to prepare and address any missing requirements before senior year."],
["Start building your college resume.","Keep track of extracurricular activities, volunteer work, jobs, awards, leadership experiences, and accomplishments.","Having this information organized now can make completing applications and writing essays much easier later."],
["Explore application fee waivers.","Ask your counselor or colleges about fee waiver opportunities.","Application fees can add up. Fee waivers may allow you to apply to colleges without paying the standard application fee if you qualify."]]},
{id:"campus",i:"🚌",n:"Getting to Campus",b:"Transportation, distance, or access to reliable internet may be a challenge.",s:[
["Research colleges close to home.","Look into nearby community colleges, universities, and technical schools.","Attending a college closer to home may reduce transportation costs and make it easier to maintain family or work responsibilities."],
["Explore campus transportation options.","Research public transportation, campus shuttles, carpooling, or student transportation programs.","Many colleges offer transportation options that can make commuting easier and less expensive."],
["Look into residential colleges.","Research campus housing, residence halls, and housing assistance opportunities.","Living on campus may eliminate the need to commute every day, although housing costs and availability should be considered."],
["Explore online or hybrid programs.","Look for degree programs that offer online classes or a combination of online and in-person learning.","These options may allow you to attend college without traveling to campus every day."],
["Ask about transportation assistance.","Contact college admissions offices or student support programs to ask about transportation resources.","Some colleges and community organizations may offer assistance or connect students with transportation resources they otherwise wouldn’t know about."]]},
{id:"conf",i:"💪",n:"Confidence & Motivation",b:"You worry about failing, making the wrong choice, or not being able to finish.",s:[
["Connect with a college student or mentor.","Talk with someone who has attended college, especially someone with a similar background or experience.","Hearing about someone else’s journey can help you realize that college students have different paths, challenges, and starting points."],
["Set a small college-related goal.","For example, research one college this week, attend a college fair, or talk to your counselor.","Accomplishing smaller goals can build confidence and help you see that preparing for college is something you can do one step at a time."],
["Learn about first-generation college students.","Explore stories and resources from students who are the first in their families to attend college.","You may discover that many students begin college without knowing exactly what to expect. You don’t need to have everything figured out before you start."],
["Explore college support programs","Research mentoring, tutoring, academic advising, first-generation student services, and college access programs.","Knowing that support is available can make college feel less intimidating and help you understand that you won’t have to navigate everything alone."],
["Celebrate your progress.","Recognize the academic, personal, and extracurricular accomplishments you’ve already achieved.","Reflecting on what you’ve accomplished can remind you of your strengths and help you recognize that you already have skills that can contribute to your success in college."]]},
{id:"family",i:"👪",n:"Family or Support Concerns",b:"People around you may not understand your goal or how college would affect them.",s:[
["Have a conversation with your family.","Share why you’re interested in college, what you hope to accomplish, and what questions or concerns they may have.","Open communication can help your family better understand your goals and give everyone an opportunity to discuss concerns and possible solutions."],
["Find a trusted adult or mentor.","Connect with a teacher, school counselor, coach, family friend, or college access advisor.","You don’t have to have someone in your family who understands the college process. A trusted adult can help answer questions, provide encouragement, and guide you through important decisions."],
["Explore family-friendly college resources.","Look for college information sessions, family workshops, and resources explaining financial aid, college costs, and the admissions process.","Providing your family with accurate information can help address misconceptions and make them feel more comfortable supporting your college plans."],
["Research colleges that fit your family needs.","Consider schools close to home, commuter options, online programs, and flexible schedules.","You may be able to find a college experience that allows you to pursue your education while staying connected to your family and maintaining important responsibilities."],
["Connect with other students and families.","Participate in college preparation programs, student groups, or family college nights.","Connecting with others who are navigating similar experiences can help you and your family feel less alone and learn from people who have been through the process."]]},
{id:"career",i:"🔍",n:"Career Uncertainty",b:"You are unsure of what career path you may want to pursue.",s:[
["Take a career interest assessment.","Ask your school counselor about career assessments that connect your interests, strengths, and personality to potential careers.","You may discover career paths you haven’t considered before. Assessments can give you a starting point for exploring careers that align with what you enjoy and what you’re good at."],
["Explore different career paths.","Research careers that interest you, including what people do in those jobs, how much they earn, and what education or training they need.","Learning about different careers can help you understand the opportunities available and determine which ones might fit your interests, goals, and lifestyle."],
["Talk to people who work in careers that interest you.","Ask teachers, family members, community professionals, or mentors about their jobs and how they got started.","Hearing firsthand experiences can help you understand what a career is really like, what skills are needed, and what steps you could take to pursue it."],
["Explore college majors and programs.","Research college degree programs, technical programs, and certifications that connect to your interests.","You may discover that one area of interest can lead to several different career opportunities. You can also learn which education pathways are available without having to commit to a specific career right away."],
["Get hands-on experience.","Look for job shadowing opportunities, internships, volunteer experiences, career fairs, or career and technical education (CTE) programs.","Experiencing a career firsthand can help you determine whether you enjoy the work. It can also introduce you to new interests and help you build valuable skills."]]}
];
var sel=[],saved=[],deck=[],pos=0;
try{var s=JSON.parse(localStorage.getItem("bq2_saved")||"[]");if(Array.isArray(s))saved=s}catch(e){}
try{var t=JSON.parse(localStorage.getItem("bq2_sel")||"[]");if(Array.isArray(t))sel=t}catch(e){}
function persist(){try{localStorage.setItem("bq2_saved",JSON.stringify(saved));localStorage.setItem("bq2_sel",JSON.stringify(sel))}catch(e){}}
function byId(id){return DATA.filter(function(d){return d.id===id})[0]}
function buildDeck(){deck=[{k:"intro"},{k:"pick"}];DATA.forEach(function(x){if(sel.indexOf(x.id)>-1)deck.push({k:"barrier",id:x.id})});deck.push({k:"sum"})}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function slideHtml(d){
 if(d.k==="intro")return '<div class="hero"><div class="emoji">🎓</div><div class="eyebrow">Explore • Choose • Save</div><h1>Explore your future.<br>Find your pathway.</h1><p class="lead">Explore common barriers that can make going to college feel challenging. Choose the ones that might affect you, flip through possible solutions, and save ideas you want to remember for your future roadmap.</p></div>';
 if(d.k==="pick"){var g=DATA.map(function(x){return '<button class="chip" data-id="'+x.id+'" aria-pressed="'+(sel.indexOf(x.id)>-1)+'"><span class="i">'+x.i+'</span><b>'+esc(x.n)+'</b><span class="d">'+esc(x.b)+'</span></button>'}).join("");
  return '<div class="eyebrow">Step 1: Pick your Roadblocks</div><h2>What could get in your way?</h2><p class="lead"><b>Select any barriers that feel relevant to going to college.</b></p><div class="grid">'+g+'</div><div class="count" id="count">'+sel.length+' selected</div>'}
 if(d.k==="barrier"){var x=byId(d.id);var c=x.s.map(function(y,n){var key=x.id+":"+n,on=saved.indexOf(key)>-1;
  return '<div class="flipwrap"><button class="flip" aria-label="Flip card: '+esc(y[0])+'"><div class="in"><div class="face front"><div class="lab">POSSIBLE SOLUTIONS</div><b>'+esc(y[0])+'</b><p>'+esc(y[1])+'</p><div class="hint">Tap to flip ↻</div></div><div class="face back"><div class="lab">HOW IT COULD HELP</div>'+esc(y[2])+'</div></div></button><button class="save" data-key="'+key+'" aria-pressed="'+on+'">'+(on?"★ Saved":"☆ Save idea")+'</button></div>'}).join("");
  return '<div class="eyebrow">Step 2: Explore Your Options</div><h2>'+x.i+' '+esc(x.n)+'</h2><div class="sub">Small steps can open big doors.</div><p class="lead"><b>Flip each card to see how an idea might help with the barrier. Save the strategies that feel useful so you can revisit them as you build your roadmap later.</b></p><div class="cards">'+c+'</div>'}
 var h=saved.length?"":'<p class="empty">Nothing saved yet. Go back and tap “Save idea” on a card.</p>';
 var rows=saved.map(function(k){var p=k.split(":"),x=byId(p[0]);if(!x||!x.s[p[1]])return"";return '<div><small>'+esc(x.n)+'</small><br><b>'+esc(x.s[p[1]][0])+'</b> '+esc(x.s[p[1]][1])+'</div>'}).join("");
 return '<div class="eyebrow">Your solution board</div><h2>Keep the ideas that fit.</h2><p class="lead">Your saved solutions are a collection of possibilities, not a commitment. Later, you can decide which ones belong on your college roadmap.</p>'+h+'<div class="sum">'+rows+'</div><p style="margin-top:14px"><button class="btn ghost" id="clear">Clear saved ideas</button> <button class="btn ghost" id="restart">Start over</button></p>'}
function show(){
 var el=document.getElementById("slide"),d=deck[pos];
 el.style.animation="none";void el.offsetWidth;el.style.animation="";
 el.innerHTML=slideHtml(d);
 document.getElementById("prog").style.width=((pos+1)/deck.length*100)+"%";
 document.getElementById("dots").innerHTML=deck.map(function(_,i){return '<i class="'+(i===pos?"on":"")+'"></i>'}).join("");
 var p=document.getElementById("prev"),n=document.getElementById("next");
 p.disabled=pos===0;n.disabled=(d.k==="pick"&&sel.length===0);
 n.textContent=d.k==="intro"?"Start →":d.k==="pick"?"Explore solutions →":"Next →";
 n.style.visibility=pos===deck.length-1?"hidden":"visible";
 document.querySelector("main").scrollTop=0;
}
function next(){var n=document.getElementById("next");if(n.disabled||pos===deck.length-1)return;if(deck[pos].k==="pick")buildDeck();pos=Math.min(deck.length-1,pos+1);show()}
function prev(){if(pos>0){if(deck[pos].k==="pick")buildDeck();pos--;show()}}
document.getElementById("next").onclick=next;
document.getElementById("prev").onclick=prev;
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")prev()});
document.getElementById("slide").addEventListener("click",function(e){
 var chip=e.target.closest(".chip"),f=e.target.closest(".flip"),sv=e.target.closest(".save");
 if(chip){var id=chip.dataset.id,i=sel.indexOf(id);if(i>-1)sel.splice(i,1);else sel.push(id);
  chip.setAttribute("aria-pressed",i===-1);document.getElementById("count").textContent=sel.length+" selected";
  document.getElementById("next").disabled=sel.length===0;persist()}
 else if(f){f.classList.toggle("on")}
 else if(sv){var k=sv.dataset.key,j=saved.indexOf(k);if(j>-1)saved.splice(j,1);else saved.push(k);
  var on=j===-1;sv.setAttribute("aria-pressed",on);sv.textContent=on?"★ Saved":"☆ Save idea";persist()}
 else if(e.target.id==="clear"){saved=[];persist();show()}
 else if(e.target.id==="restart"){sel=[];saved=[];persist();buildDeck();pos=0;show()}
});
var sx=null;
document.addEventListener("touchstart",function(e){sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70){dx<0?next():prev()}sx=null},{passive:true});
buildDeck();show();
</script>
</body>
</html>
